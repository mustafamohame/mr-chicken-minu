<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>إدارة مستر جكن</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#F4F3EF;color:#151515;font-family:Tajawal,sans-serif}
.w{max-width:640px;margin:auto;padding:16px}
h1{font-size:22px;margin:8px 0}h2{font-size:18px;margin:0 0 10px}
.box{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px}
input,select,textarea{width:100%;min-height:46px;border:1.5px solid #ccc;border-radius:10px;padding:8px 12px;font:inherit;margin:4px 0}
button{font-family:inherit;cursor:pointer;min-height:44px;border-radius:10px;border:1.5px solid #151515;background:#fff;padding:0 14px;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #C8102E}
.pr{background:#C8102E;border-color:#C8102E;color:#fff}.dg{color:#C8102E;border-color:#C8102E}
.r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.r .g{flex:1;min-width:120px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee;flex-wrap:wrap}.row .g{flex:1}
.off{opacity:.5}.top{display:flex;justify-content:space-between;align-items:center}
#msg{position:fixed;bottom:16px;left:16px;right:16px;max-width:500px;margin:auto;background:#151515;color:#fff;padding:12px 16px;border-radius:12px;display:none;text-align:center}
</style></head><body><div class="w">
<div id="lg" class="box"><h1>تسجيل دخول الإدارة</h1><input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="pr" id="in" style="width:100%;margin-top:6px">دخول</button></div>
<div id="ap" hidden>
<div class="top"><h1>إدارة المنيو</h1><button id="out">خروج</button></div>
<div class="box"><h2>الأقسام</h2><div class="r"><input class="g" id="cn" placeholder="اسم قسم جديد"><button class="pr" id="ca">إضافة قسم</button></div><div id="cs"></div></div>
<div class="box"><h2 id="ft">وجبة جديدة</h2>
<select id="ic" aria-label="القسم"></select><input id="in_" placeholder="اسم الوجبة"><input id="id" placeholder="وصف قصير (اختياري)"><input id="ip" type="number" inputmode="numeric" placeholder="السعر بالدينار"><div class="r" style="margin:6px 0"><img id="pv" alt="صورة الوجبة" hidden style="width:64px;height:64px;object-fit:cover;border-radius:10px"><button type="button" class="g" id="pk">اختيار صورة من الجهاز</button><button type="button" class="dg" id="rm" hidden>إزالة الصورة</button></div><input id="fi" type="file" accept="image/*" hidden><input id="im" type="hidden">
<div class="r"><button class="pr g" id="sv">حفظ الوجبة</button><button id="cx" hidden>إلغاء التعديل</button></div></div>
<div class="box"><h2>الوجبات</h2><div id="ls"></div></div></div></div><div id="msg" role="status"></div>
<script>
const U='https://vbhxfufydzfluebmvfni.supabase.co',K='sb_publishable_PQ_Um6FC90O6UUyrAGhIyg_cTmMGteK';
let T=sessionStorage.getItem('t'),cats=[],items=[],ed=null;
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(t){const m=$('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500)}
async function api(p,o={}){const r=await fetch(U+p,{...o,headers:{apikey:K,Authorization:'Bearer '+(T||K),'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})}});
 if(r.status===401){out();throw new Error('انتهت الجلسة، سجّل الدخول من جديد')}if(!r.ok)throw new Error('تعذر تنفيذ العملية');return r.status===204?null:r.json()}
$('in').onclick=async()=>{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})});
 const j=await r.json();if(!r.ok)return say('البريد أو كلمة المرور غير صحيحة');T=j.access_token;sessionStorage.setItem('t',T);start()};
function out(){T=null;sessionStorage.removeItem('t');$('lg').hidden=false;$('ap').hidden=true}$('out').onclick=out;
async function start(){if(!T)return;$('lg').hidden=true;$('ap').hidden=false;try{await refresh()}catch(e){say(e.message)}}
async function refresh(){[cats,items]=await Promise.all([api('/rest/v1/categories?order=sort'),api('/rest/v1/items?order=sort')]);
 $('ic').innerHTML=cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
 $('cs').innerHTML=cats.map(c=>`<div class="row"><span class="g">${esc(c.name)}</span><button data-up="${c.id}" aria-label="للأعلى">↑</button><button data-ren="${c.id}">تسمية</button><button class="dg" data-dc="${c.id}">حذف</button></div>`).join('');
 $('ls').innerHTML=items.map(x=>`<div class="row ${x.available?'':'off'}"><span class="g"><b>${esc(x.name)}</b><br><small>${esc(cats.find(c=>c.id===x.category_id)?.name||'')} · ${Number(x.price).toLocaleString('en')} د.ع</small></span><button data-av="${x.id}">${x.available?'إخفاء (نفدت)':'إظهار'}</button><button data-ed="${x.id}">تعديل</button><button class="dg" data-di="${x.id}">حذف</button></div>`).join('')||'<small>لا توجد وجبات بعد.</small>'}
$('ca').onclick=async()=>{const n=$('cn').value.trim();if(!n)return say('اكتب اسم القسم');try{await api('/rest/v1/categories',{method:'POST',body:JSON.stringify({name:n,sort:cats.length})});$('cn').value='';await refresh();say('تمت إضافة القسم')}catch(e){say(e.message)}};
function sp(u){$('im').value=u||'';$('pv').hidden=!u;if(u)$('pv').src=u;$('rm').hidden=!u;$('pk').textContent=u?'تغيير الصورة':'اختيار صورة من الجهاز'}
async function up(f){const b=await createImageBitmap(f),k=Math.min(1,900/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 const bl=await new Promise(o=>c.toBlob(o,'image/jpeg',.82)),n=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
 const x=await fetch(U+'/storage/v1/object/menu-images/'+n,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+T,'Content-Type':'image/jpeg'},body:bl});if(!x.ok)throw new Error('تعذر رفع الصورة. تأكد من تشغيل storage.sql');return U+'/storage/v1/object/public/menu-images/'+n}
$('pk').onclick=()=>$('fi').click();$('rm').onclick=()=>sp('');
$('fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;$('pk').disabled=$('sv').disabled=true;$('pk').textContent='جاري رفع الصورة...';try{sp(await up(f))}catch(er){say(er.message);sp($('im').value)}$('pk').disabled=$('sv').disabled=false};
function reset(){ed=null;['in_','id','ip'].forEach(i=>$(i).value='');sp('');$('ft').textContent='وجبة جديدة';$('cx').hidden=true}$('cx').onclick=reset;
$('sv').onclick=async()=>{const b={category_id:$('ic').value,name:$('in_').value.trim(),description:$('id').value.trim(),price:Number($('ip').value),image_url:$('im').value.trim()};
 if(!b.category_id||!b.name||!(b.price>=0)||$('ip').value==='')return say('اختر القسم واكتب الاسم والسعر');
 try{if(ed)await api('/rest/v1/items?id=eq.'+ed,{method:'PATCH',body:JSON.stringify(b)});else await api('/rest/v1/items',{method:'POST',body:JSON.stringify({...b,sort:items.length})});reset();await refresh();say('تم الحفظ')}catch(e){say(e.message)}};
document.addEventListener('click',async e=>{const b=e.target.closest('button'),d=b&&b.dataset;if(!d)return;try{
 if(d.ed){const x=items.find(y=>y.id===d.ed);ed=x.id;$('ic').value=x.category_id;$('in_').value=x.name;$('id').value=x.description;$('ip').value=x.price;sp(x.image_url);$('ft').textContent='تعديل: '+x.name;$('cx').hidden=false;$('ft').scrollIntoView({behavior:'smooth'})}
 if(d.av){const x=items.find(y=>y.id===d.av);await api('/rest/v1/items?id=eq.'+x.id,{method:'PATCH',body:JSON.stringify({available:!x.available})});await refresh()}
 if(d.di&&confirm('حذف هذه الوجبة؟')){await api('/rest/v1/items?id=eq.'+d.di,{method:'DELETE'});await refresh();say('تم الحذف')}
 if(d.dc&&confirm('حذف القسم مع كل وجباته؟')){await api('/rest/v1/categories?id=eq.'+d.dc,{method:'DELETE'});await refresh();say('تم حذف القسم')}
 if(d.ren){const c=cats.find(y=>y.id===d.ren),n=prompt('الاسم الجديد',c.name);if(n&&n.trim()){await api('/rest/v1/categories?id=eq.'+c.id,{method:'PATCH',body:JSON.stringify({name:n.trim()})});await refresh()}}
 if(d.up){const i=cats.findIndex(y=>y.id===d.up);if(i>0){const a=cats[i],p=cats[i-1];await api('/rest/v1/categories?id=eq.'+a.id,{method:'PATCH',body:JSON.stringify({sort:i-1})});await api('/rest/v1/categories?id=eq.'+p.id,{method:'PATCH',body:JSON.stringify({sort:i})});await refresh()}}
}catch(er){say(er.message)}});
start()
</script></body></html>
