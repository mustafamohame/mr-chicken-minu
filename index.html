<script>
const URL_='https://vbhxfufydzfluebmvfni.supabase.co',KEY='sb_publishable_PQ_Um6FC90O6UUyrAGhIyg_cTmMGteK',WA='9647724505055';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
let cats=[],items=[],cur=null,cart={};
const $=i=>document.getElementById(i),f=n=>Number(n).toLocaleString('en')+' د.ع';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{
 const [c,i]=await Promise.all(['categories?order=sort','items?order=sort'].map(p=>fetch(URL_+'/rest/v1/'+p,{headers:H}).then(r=>{if(!r.ok)throw 0;return r.json()})));
 cats=c;items=i;cur=cats[0]?.id;draw()}catch(e){$('list').innerHTML='<div class="msg">تعذر تحميل القائمة. حدّث الصفحة وحاول مرة ثانية.</div>'}}
function draw(){
 $('tabs').innerHTML=cats.map(c=>`<button class="tab ${c.id===cur?'on':''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
 const c=cats.find(x=>x.id===cur),l=items.filter(x=>x.category_id===cur);
 $('list').innerHTML=!c?'<div class="msg">القائمة فارغة حالياً.</div>':'<h2>'+esc(c.name)+'</h2>'+(l.length?l.map(x=>`<div class="it">${x.image_url?`<img src="${esc(x.image_url)}" alt="" loading="lazy">`:''}<span class="n">${esc(x.name)}</span><span class="dots"></span><span class="p">${f(x.price)}</span><button class="q" data-a="${x.id}" aria-label="أضف ${esc(x.name)}" ${x.available?'':'disabled'}>${x.available?'+':'نفدت'}</button></div>${x.description?`<div class="d">${esc(x.description)}</div>`:''}`).join(''):'<div class="msg">لا توجد وجبات بهذا القسم.</div>')}
function sum(){let n=0,t=0;for(const id in cart){const x=items.find(y=>y.id===id);if(x){n+=cart[id];t+=cart[id]*x.price}}return[n,t]}
function upd(){const[n,t]=sum();$('cc').textContent=n;$('bar').style.display=n?'flex':'none';$('bt').textContent='عرض السلة · '+n+' وجبة';$('bs').textContent=f(t)}
function cl(){const[,t]=sum();$('cl').innerHTML=Object.keys(cart).map(id=>{const x=items.find(y=>y.id===id);return`<div class="cr"><span>${esc(x.name)}</span><button class="sm" data-m="${id}" aria-label="نقص">−</button><b>${cart[id]}</b><button class="sm" data-a="${id}" aria-label="زد">+</button></div>`}).join('')||'<div class="msg">السلة فارغة</div>';$('tot').textContent='المجموع: '+f(t)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.c){cur=b.dataset.c;draw()}
 if(b.dataset.a){cart[b.dataset.a]=(cart[b.dataset.a]||0)+1;upd();if($('sh').style.display==='flex')cl()}
 if(b.dataset.m){const k=b.dataset.m;if(--cart[k]<=0)delete cart[k];upd();cl()}});
const tg=()=>{$('dl').hidden=$('md').value!=='توصيل'};$('md').onchange=tg;
const open=()=>{cl();tg();$('er').textContent='';$('sh').style.display='flex'};$('cb').onclick=open;$('bar').onclick=open;$('cls').onclick=()=>$('sh').style.display='none';
$('snd').onclick=()=>{const[n,t]=sum();if(!n)return;
 const v=i=>$(i).value.trim(),md=v('md'),ph=v('ph').replace(/[\s-]/g,''),E=m=>{$('er').textContent=m};
 if(!md)return E('اختر نوع الطلب: استلام أو توصيل');
 if(!v('nm'))return E('اكتب اسمك');
 if(!/^\+?\d{10,14}$/.test(ph))return E('اكتب رقم موبايل صحيح');
 if(md==='توصيل'&&!v('ad'))return E('اكتب عنوان التوصيل');
 E('');
 const L=Object.keys(cart).map(id=>{const x=items.find(y=>y.id===id);return`• ${x.name} × ${cart[id]}`});
 const m=['طلب جديد من المنيو:',...L,'المجموع: '+f(t),'نوع الطلب: '+md,'الاسم: '+v('nm'),'الموبايل: '+ph,
  ...(md==='توصيل'?['العنوان: '+v('ad'),...(v('lm')?['نقطة دالة: '+v('lm')]:[])]:[]),...(v('nt')?['ملاحظات: '+v('nt')]:[])].join('\n');
 window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank')};
const SOC={instagram:'https://www.instagram.com/mr.chicken18',tiktok:'',facebook:'https://www.facebook.com/share/1HrMyts7Qz/'};
(function(){const w=$('wl'),I={
 instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r=".8" fill="#fff"/>',
 tiktok:'<path d="M14 3v11.500a3.500 3.500 0 1 1-3.500-3.500M14 3c.4 2.600 2 4.200 5 4.500"/>',
 facebook:'<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v8h4v-8h3l1-4h-4V8z"/>',
 whatsapp:'<path d="M3 21l1.600-4.800A9 9 0 1 1 8 19.500L3 21z"/><path d="M9 8.500c.5 2.500 3 5 5.500 5.500l1.200-1.200-2-1-.8.800c-1-.4-2-1.400-2.400-2.400l.8-.8-1-2L9 8.500z"/>'};
 const L={...SOC,whatsapp:'https://wa.me/'+WA};
 $('soc').innerHTML=Object.keys(L).filter(k=>L[k]).map(k=>`<a class="gl" href="${esc(L[k])}" target="_blank" rel="noopener" aria-label="${k}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg></a>`).join('');
 try{if(sessionStorage.getItem('in')){w.remove();return}}catch(e){}
 document.body.style.overflow='hidden';
 w.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;if(b.dataset.go)$('md').value=b.dataset.go;
  try{sessionStorage.setItem('in','1')}catch(e){}w.classList.add('out');document.body.style.overflow='';setTimeout(()=>w.remove(),400)})})();
(function(){const a=$('au'),b=$('mu'),i=$('mi');a.volume=.35;
 const on='<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.500 8.500a5 5 0 0 1 0 7M19 6a8.500 8.500 0 0 1 0 12"/>',off='<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>';
 const ui=()=>{const p=!a.paused;i.innerHTML=p?on:off;b.setAttribute('aria-pressed',p);b.setAttribute('aria-label',p?'إيقاف الموسيقى':'تشغيل الموسيقى')};
 a.addEventListener('error',()=>{b.hidden=true});a.addEventListener('play',ui);a.addEventListener('pause',ui);ui();b.hidden=false;
 b.onclick=()=>{if(a.paused)a.play().catch(()=>{});else a.pause()};
 $('wl')&&$('wl').addEventListener('click',e=>{if(e.target.closest('[data-go]'))a.play().catch(()=>{})})})();
load()
